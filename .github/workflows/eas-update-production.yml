name: Publish Android production OTA update

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full reviewed main commit SHA to publish
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_RUNTIME_1_0_4 to authorize the OTA
        required: true
        type: string
concurrency:
  group: user-app-production-ota
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-update:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_RUNTIME_1_0_4'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify reviewed release commit
        shell: bash
        env:
          REVIEWED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          [[ "$REVIEWED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_RELEASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate user-app
        run: npx tsc --noEmit -p user-app/tsconfig.json

      - name: Verify runtime 1.0.4 release identity
        working-directory: user-app
        run: npm run verify:ota:v10

      - name: Configure Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish approved runtime 1.0.4 update
        working-directory: user-app
        run: npx eas-cli update --channel production-v10-performance --platform android --environment production --message "approved main ${GITHUB_SHA::7}" --non-interactive
